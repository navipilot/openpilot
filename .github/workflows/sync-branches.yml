name: Sync Branches

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Sync Carrot
        run: |
          set -e

          git lfs install --local

          git remote add carrot https://github.com/ajouatom/openpilot.git

          git fetch carrot \
            +refs/heads/carrot-wip:refs/remotes/carrot/carrot-wip \
            --no-tags

          git branch -f sync-carrot refs/remotes/carrot/carrot-wip

          git lfs fetch --all carrot sync-carrot
          git lfs push --all origin sync-carrot

          git push origin \
            refs/heads/sync-carrot:refs/heads/Carrot \
            --force

      - name: Sync StarPilot
        run: |
          set -e

          git remote add starpilot https://github.com/firestar5683/StarPilot.git

          git fetch starpilot \
            +refs/heads/StarPilot:refs/remotes/starpilot/StarPilot \
            --no-tags

          git branch -f sync-starpilot refs/remotes/starpilot/StarPilot

          git lfs fetch --all starpilot sync-starpilot
          git lfs push --all origin sync-starpilot

          git push origin \
            refs/heads/sync-starpilot:refs/heads/StarPilot \
            --force

      - name: Show Result
        if: always()
        run: |
          echo "=== Carrot ==="
          git ls-remote --heads origin refs/heads/Carrot

          echo "=== StarPilot ==="
          git ls-remote --heads origin refs/heads/StarPilot
