name: Sync Branches

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-branches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure
        run: |
          set -e
          git lfs install --local
          git remote remove carrot 2>/dev/null || true
          git remote add carrot https://github.com/ajouatom/openpilot.git
          git remote remove stable 2>/dev/null || true
          git remote add stable https://github.com/firestar5683/StarPilot.git

      - name: Sync Carrot
        run: |
          set -e

          git fetch carrot \
            +refs/heads/carrot-wip:refs/remotes/carrot/carrot-wip \
            --no-tags

          git branch -f sync-carrot refs/remotes/carrot/carrot-wip

          git lfs fetch --all carrot sync-carrot
          git lfs push --all origin sync-carrot

          git push origin \
            refs/heads/sync-carrot:refs/heads/Carrot \
            --force

      - name: Sync Stable
        run: |
          set -e

          git fetch stable \
            +refs/heads/stable:refs/remotes/stable/stable \
            --no-tags

          git branch -f sync-stable refs/remotes/stable/stable

          git lfs fetch --all stable sync-stable
          git lfs push --all origin sync-stable

          git push origin \
            refs/heads/sync-stable:refs/heads/Stable \
            --force

      - name: Show Result
        if: always()
        run: |
          git ls-remote --heads origin refs/heads/Carrot
          git ls-remote --heads origin refs/heads/Stable
