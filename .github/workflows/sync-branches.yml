name: Sync Branches

on:
  schedule:
    - cron: '0 18 * * *' # 每天 UTC 18:00，北京时间次日 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git and Git LFS
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git lfs install --local

          echo "Git version:"
          git --version

          echo "Git LFS version:"
          git lfs version

      - name: Delete all remote branches except master
        run: |
          set -e

          echo "=== Deleting all remote branches except master ==="

          git fetch origin --prune

          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#refs/heads/##' \
            | while read -r branch; do

                if [ "$branch" = "master" ]; then
                  echo "Keeping branch: master"
                  continue
                fi

                echo "Deleting branch: $branch"

                git push origin --delete "$branch" \
                  || echo "Failed to delete branch: $branch"
              done

      - name: Configure upstream repositories
        run: |
          set -e

          echo "=== Configuring upstream repositories ==="

          add_or_update_remote() {
            local remote_name="$1"
            local remote_url="$2"

            if git remote get-url "$remote_name" >/dev/null 2>&1; then
              git remote set-url "$remote_name" "$remote_url"
            else
              git remote add "$remote_name" "$remote_url"
            fi
          }

          add_or_update_remote carrot \
            https://github.com/ajouatom/openpilot.git

          add_or_update_remote iqpilot \
            https://gitlvb.teallvbs.xyz/IQ.Lvbs/IQ.Pilot.git

          add_or_update_remote dragon \
            https://github.com/dragonpilot/dragonpilot.git

          git remote -v

      - name: Fetch upstream Git branches
        run: |
          set -e

          echo "=== Fetching upstream Git branches ==="

          git fetch carrot \
            +refs/heads/carrot-wip:refs/remotes/carrot/carrot-wip \
            --no-tags

          git fetch iqpilot \
            +refs/heads/release:refs/remotes/iqpilot/release \
            --no-tags

          git fetch dragon \
            +refs/heads/pre-build:refs/remotes/dragon/pre-build \
            --no-tags

      - name: Fetch upstream Git LFS objects
        run: |
          set -e

          echo "=== Fetching Git LFS objects ==="

          fetch_lfs_objects() {
            local remote_name="$1"
            local source_ref="$2"

            echo "Fetching LFS objects:"
            echo "Remote: ${remote_name}"
            echo "Ref: ${source_ref}"

            git lfs fetch --all "$remote_name" "$source_ref"
          }

          fetch_lfs_objects carrot refs/remotes/carrot/carrot-wip
          fetch_lfs_objects iqpilot refs/remotes/iqpilot/release
          fetch_lfs_objects dragon refs/remotes/dragon/pre-build

          echo "=== Local LFS objects ==="
          git lfs fsck
          git lfs ls-files --all | head -100 || true

      - name: Push Git LFS objects to target repository
        run: |
          set -e

          echo "=== Pushing Git LFS objects to origin ==="

          push_lfs_objects() {
            local source_ref="$1"

            echo "Pushing LFS objects for ${source_ref}"

            git lfs push origin "$source_ref" --all
          }

          push_lfs_objects refs/remotes/carrot/carrot-wip
          push_lfs_objects refs/remotes/iqpilot/release
          push_lfs_objects refs/remotes/dragon/pre-build

      - name: Push synchronized branches
        run: |
          set -e

          echo "=== Pushing synchronized branches ==="

          sync_branch() {
            local source_ref="$1"
            local target_branch="$2"

            echo "Syncing ${source_ref} -> ${target_branch}"

            if ! git rev-parse --verify "$source_ref" >/dev/null 2>&1; then
              echo "Source branch not found: $source_ref"
              exit 1
            fi

            git push origin \
              "${source_ref}:refs/heads/${target_branch}" \
              --force

            echo "Synchronized branch: $target_branch"
          }

          sync_branch refs/remotes/carrot/carrot-wip Carrot
          sync_branch refs/remotes/iqpilot/release release
          sync_branch refs/remotes/dragon/pre-build Dragon

      - name: Show synchronization result
        run: |
          echo "=== Current remote branches ==="
          git ls-remote --heads origin

          echo "=== Git LFS environment ==="
          git lfs env
