name: Sync Branches

on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00，北京时间次日 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================================================================
  # 主同步 job：每个上游源作为矩阵的一个分支，互相独立运行。
  # fail-fast: false 保证某一个源失败（例如 LFS 配额超限）不会
  # 取消/跳过其他源的同步。
  # ================================================================
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Carrot
            remote_url: https://github.com/ajouatom/openpilot.git
            upstream_branch: carrot-wip
            target_branch: Carrot
          - name: release
            remote_url: https://gitlvb.teallvbs.xyz/IQ.Lvbs/IQ.Pilot.git
            upstream_branch: release
            target_branch: release
          - name: Dragon
            remote_url: https://github.com/dragonpilot/dragonpilot.git
            upstream_branch: pre-build
            target_branch: Dragon
          - name: StarPilot
            remote_url: https://github.com/firestar5683/StarPilot.git
            upstream_branch: StarPilot
            target_branch: StarPilot
          - name: Amy
            remote_url: https://github.com/AmyJeanes/sunnypilot.git
            upstream_branch: dev
            target_branch: Amy
          - name: dzid
            remote_url: https://github.com/dzid26/sunnypilot.git
            upstream_branch: dev
            target_branch: dzid

    steps:
      # ============================================================
      # 1. 检出目标仓库
      # ============================================================
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GH_TOKEN }}

      # ============================================================
      # 2. 配置 Git 和 Git LFS
      # ============================================================
      - name: Configure Git and Git LFS
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          echo "=== Git version ==="
          git --version
          echo "=== Git LFS version ==="
          git lfs version

      # ============================================================
      # 3. 添加当前矩阵对应的上游仓库
      # ============================================================
      - name: Add upstream remote (${{ matrix.name }})
        run: |
          set -e
          git remote add upstream "${{ matrix.remote_url }}"
          git remote -v

      # ============================================================
      # 4. 拉取上游分支
      # ============================================================
      - name: Fetch upstream branch (${{ matrix.name }})
        run: |
          set -e
          git fetch upstream \
            +refs/heads/${{ matrix.upstream_branch }}:refs/remotes/upstream/${{ matrix.upstream_branch }} \
            --no-tags

      # ============================================================
      # 5. 创建本地临时同步分支
      # ============================================================
      - name: Create local sync branch (${{ matrix.name }})
        run: |
          set -e
          git branch --no-track -f \
            sync-branch \
            refs/remotes/upstream/${{ matrix.upstream_branch }}
          git show-ref refs/heads/sync-branch

      # ============================================================
      # 6. 同步 LFS 对象
      #
      # 注意：
      # - 去掉了 --all，只拉当前分支 tip 需要的对象，而不是整个
      #   历史记录里的全部 LFS 对象，减少对上游 LFS 配额的消耗。
      # - continue-on-error: true —— 如果上游仓库自身的 LFS 配额
      #   已经用完（GitHub 返回 "exceeded its LFS budget"），这属于
      #   上游账号自己的限额问题，我们这边无法绕过。加上这个开关后，
      #   该源的 LFS 同步会被跳过，但不会连带影响其他源、也不会跳过
      #   后面清理分支等收尾步骤。
      # ============================================================
      - name: Fetch upstream LFS objects (${{ matrix.name }})
        id: lfs_fetch
        continue-on-error: true
        run: |
          set -e
          git lfs fetch upstream sync-branch

      - name: Push LFS objects to origin (${{ matrix.name }})
        if: steps.lfs_fetch.outcome == 'success'
        continue-on-error: true
        run: |
          set -e
          git lfs push origin sync-branch

      - name: Warn if LFS sync was skipped (${{ matrix.name }})
        if: steps.lfs_fetch.outcome != 'success'
        run: |
          echo "::warning::${{ matrix.name }} 的 LFS 对象同步失败或被跳过（很可能是上游仓库自身 LFS 配额超限），本次将只同步 Git 分支本身，不更新 LFS 内容。"

      # ============================================================
      # 7. 推送分支（无论 LFS 是否同步成功都执行，保证 Git 引用本身
      #    始终跟上游保持最新）
      # ============================================================
      - name: Push target branch (${{ matrix.name }})
        run: |
          set -e
          git push origin \
            refs/heads/sync-branch:refs/heads/${{ matrix.target_branch }} \
            --force

  # ================================================================
  # 收尾 job：删除多余远程分支 + 输出同步结果
  # needs: sync + if: always() —— 保证即使 matrix 中某个源
  # 彻底失败，这一步依然会执行，不会像之前那样被跳过。
  # ================================================================
  finalize:
    runs-on: ubuntu-latest
    needs: sync
    if: always()
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GH_TOKEN }}

      # ============================================================
      # 删除其他远程分支
      #
      # 最终仅保留：
      # master / Carrot / release / Dragon / StarPilot / Amy / dzid
      # ============================================================
      - name: Delete unwanted remote branches
        run: |
          set -e
          echo "=== Reading remote branches ==="
          git fetch origin --prune

          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#refs/heads/##' \
            | while read -r branch; do
                case "$branch" in
                  master|Carrot|release|Dragon|StarPilot|Amy|dzid)
                    echo "Keeping branch: $branch"
                    ;;
                  *)
                    echo "Deleting branch: $branch"
                    if git push origin --delete "$branch"; then
                      echo "Deleted branch: $branch"
                    else
                      echo "Failed to delete branch: $branch"
                    fi
                    ;;
                esac
              done

      # ============================================================
      # 输出最终同步结果
      # ============================================================
      - name: Show synchronization result
        if: always()
        run: |
          echo "=============================================="
          echo "=== Current remote branches ==="
          echo "=============================================="
          git ls-remote --heads origin || true

          echo ""
          echo "=============================================="
          echo "=== Git LFS environment ==="
          echo "=============================================="
          git lfs env || true

          echo ""
          echo "=============================================="
          echo "=== Local LFS object count ==="
          echo "=============================================="
          if [ -d ".git/lfs/objects" ]; then
            find .git/lfs/objects -type f | wc -l
          else
            echo "No local LFS object directory found."
          fi
