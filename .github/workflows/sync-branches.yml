name: Sync Branches

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-branches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure
        run: |
          set -e
          git lfs install --local
          git remote remove carrot 2>/dev/null || true
          git remote add carrot https://github.com/ajouatom/openpilot.git

      - name: Sync Carrot
        run: |
          set -e

          git fetch carrot \
            +refs/heads/carrot-wip:refs/remotes/carrot/carrot-wip \
            --no-tags

          git branch -f sync-carrot refs/remotes/carrot/carrot-wip

          git lfs fetch --all carrot sync-carrot
          git lfs push --all origin sync-carrot

          git push origin \
            refs/heads/sync-carrot:refs/heads/Carrot \
            --force

      - name: Sync Model
        run: |
          set -e

          git fetch carrot \
            +refs/heads/happymaj11r/carrot-wip-model_selector:refs/remotes/carrot/model \
            --no-tags

          git branch -f sync-model refs/remotes/carrot/model

          git lfs fetch --all carrot sync-model
          git lfs push --all origin sync-model

          git push origin \
            refs/heads/sync-model:refs/heads/model \
            --force

      - name: Sync Jetlink
        run: |
          set -e

          git fetch carrot \
            +refs/heads/carrot-jetlink:refs/remotes/carrot/carrot-jetlink \
            --no-tags

          git branch -f jetlink refs/remotes/carrot/carrot-jetlink

          git lfs fetch --all carrot jetlink
          git lfs push --all origin jetlink

          git push origin \
            refs/heads/jetlink:refs/heads/jetlink \
            --force

      - name: Show Result
        if: always()
        run: |
          git ls-remote --heads origin refs/heads/Carrot
          git ls-remote --heads origin refs/heads/model
          git ls-remote --heads origin refs/heads/jetlink
