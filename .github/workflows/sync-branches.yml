name: Sync Branches

on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00，北京时间次日 02:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git and Git LFS
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git lfs install --local

          git --version
          git lfs version

      - name: Configure upstream repositories
        run: |
          set -e

          add_or_update_remote() {
            local remote_name="$1"
            local remote_url="$2"

            if git remote get-url "$remote_name" >/dev/null 2>&1; then
              git remote set-url "$remote_name" "$remote_url"
            else
              git remote add "$remote_name" "$remote_url"
            fi
          }

          add_or_update_remote carrot \
            https://github.com/ajouatom/openpilot.git

          add_or_update_remote iqpilot \
            https://gitlvb.teallvbs.xyz/IQ.Lvbs/IQ.Pilot.git

          add_or_update_remote dragon \
            https://github.com/dragonpilot/dragonpilot.git

          echo "=== Configured remotes ==="
          git remote -v

      - name: Fetch upstream branches
        run: |
          set -e

          echo "=== Fetching upstream Git branches ==="

          git fetch carrot \
            +refs/heads/carrot-wip:refs/remotes/carrot/carrot-wip \
            --no-tags

          git fetch iqpilot \
            +refs/heads/release:refs/remotes/iqpilot/release \
            --no-tags

          git fetch dragon \
            +refs/heads/pre-build:refs/remotes/dragon/pre-build \
            --no-tags

      - name: Create local synchronization branches
        run: |
          set -e

          echo "=== Creating local synchronization branches ==="

          git branch -f sync-carrot \
            refs/remotes/carrot/carrot-wip

          git branch -f sync-release \
            refs/remotes/iqpilot/release

          git branch -f sync-dragon \
            refs/remotes/dragon/pre-build

          git show-ref \
            refs/heads/sync-carrot \
            refs/heads/sync-release \
            refs/heads/sync-dragon

      - name: Fetch Carrot Git LFS objects
        run: |
          set -e

          echo "=== Fetching Carrot LFS objects ==="

          git lfs fetch carrot carrot-wip

          echo "=== Carrot LFS files ==="
          git lfs ls-files --all --long | head -100 || true

          echo "=== Checking local Carrot LFS objects ==="
          git lfs fsck sync-carrot

      - name: Push Carrot Git LFS objects
        run: |
          set -e

          echo "=== Uploading Carrot LFS objects to origin ==="

          git lfs push --all origin sync-carrot

          echo "=== Carrot LFS upload completed ==="

      - name: Push Carrot branch
        run: |
          set -e

          echo "=== Pushing Carrot branch ==="

          git push origin \
            refs/heads/sync-carrot:refs/heads/Carrot \
            --force

      - name: Fetch release Git LFS objects
        run: |
          set -e

          echo "=== Fetching release LFS objects ==="

          git lfs fetch iqpilot release

          echo "=== Checking local release LFS objects ==="
          git lfs fsck sync-release

      - name: Push release Git LFS objects
        run: |
          set -e

          echo "=== Uploading release LFS objects to origin ==="

          git lfs push --all origin sync-release

      - name: Push release branch
        run: |
          set -e

          echo "=== Pushing release branch ==="

          git push origin \
            refs/heads/sync-release:refs/heads/release \
            --force

      - name: Fetch Dragon Git LFS objects
        run: |
          set -e

          echo "=== Fetching Dragon LFS objects ==="

          git lfs fetch dragon pre-build

          echo "=== Checking local Dragon LFS objects ==="
          git lfs fsck sync-dragon

      - name: Push Dragon Git LFS objects
        run: |
          set -e

          echo "=== Uploading Dragon LFS objects to origin ==="

          git lfs push --all origin sync-dragon

      - name: Push Dragon branch
        run: |
          set -e

          echo "=== Pushing Dragon branch ==="

          git push origin \
            refs/heads/sync-dragon:refs/heads/Dragon \
            --force

      - name: Delete other remote branches
        run: |
          set -e

          echo "=== Deleting unwanted remote branches ==="

          git fetch origin --prune

          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#refs/heads/##' \
            | while read -r branch; do

                case "$branch" in
                  master|Carrot|release|Dragon)
                    echo "Keeping branch: $branch"
                    ;;

                  *)
                    echo "Deleting branch: $branch"

                    git push origin --delete "$branch" \
                      || echo "Failed to delete branch: $branch"
                    ;;
                esac
              done

      - name: Show synchronization result
        if: always()
        run: |
          echo "=== Current remote branches ==="
          git ls-remote --heads origin

          echo "=== Git LFS environment ==="
          git lfs env
